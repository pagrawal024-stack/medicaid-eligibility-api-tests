[pytest]
testpaths = tests
addopts = -ra --strict-markers
log_level = INFO
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
markers =
    smoke: fast checks that the system is up and core flows work
    regression: full functional coverage
    db: validates data directly in the database
    e2e: end-to-end member journeys
